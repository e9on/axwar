# PR 자동 검사: 백엔드 pytest, 프론트 타입 검사·빌드, 시험 실행기 문법 검사
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    name: 백엔드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 시험 실행기 문법 검사
        run: python -m py_compile eval/*.py
      - name: uv 설치
        uses: astral-sh/setup-uv@v10.3.3
      - name: 도구 테스트 (tools/)
        working-directory: tools
        run: uv run --no-project --python 3.11 --with markdown --with pytest python -m pytest -q -p no:cacheprovider
      - name: pytest
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest -q
  frontend:
    name: 프론트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 프론트 폴더 확인
        id: check
        run: |
          if [ -f frontend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "frontend/ 없음 — 건너뜀"; fi
      - uses: actions/setup-node@v7
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 타입 검사와 빌드
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
