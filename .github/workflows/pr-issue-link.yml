# PR 본문에 "Closes #번호" 같은 이슈 연결이 없으면 실패한다
name: PR-이슈 연결
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const ok = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body);
            if (!ok) core.setFailed('PR 본문에 연결할 이슈를 적어 주세요. 예: Closes #12');
            else core.info('이슈 연결 확인됨');
